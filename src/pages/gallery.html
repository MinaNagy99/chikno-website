<!--page:gallery | title:الصور – تشيكنو | cbar-->
<style>
.ghero h1{display:flex;align-items:flex-end;gap:.2em}
.ghero h1 sup{font-family:var(--fl);font-size:.22em;color:var(--ember);align-self:flex-start;margin-top:.3em}
.gfil{position:sticky;top:0;z-index:30;padding-block:14px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);transition:top .5s var(--ease)}
body:has(.hdr:not(.hide)) .gfil{top:78px}
@media (max-width:560px){body:has(.hdr:not(.hide)) .gfil{top:68px}.gfil .pills{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}}
.ggrid{display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:clamp(160px,18vw,260px);grid-auto-flow:dense;gap:14px;padding-block:24px 120px}
.gi{position:relative;border-radius:22px;overflow:hidden;cursor:zoom-in;background:var(--deep)}
.gi.big{grid-column:span 2;grid-row:span 2}
.gi.tall{grid-row:span 2}
.gi img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform 1s var(--ease),filter .6s}
.gi:hover img{transform:scale(1.08)}
.gi .cap{position:absolute;inset-inline:12px;bottom:12px;z-index:2;display:flex;justify-content:space-between;align-items:center;gap:8px;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(8px);padding:8px 12px;border-radius:12px;font-weight:600;font-size:.88rem;transform:translateY(130%);transition:transform .5s var(--ease)}
.gi:hover .cap,.gi:focus-visible .cap{transform:none}
.gi .cap .price{font-size:1rem}
@media (hover:none){.gi .cap{transform:none}}
@media (max-width:900px){.ggrid{grid-template-columns:repeat(2,1fr);grid-auto-rows:42vw}.gi .cap{font-size:.8rem}}
.lb{position:fixed;inset:0;z-index:110;display:none;background:#0E0A08;color:#F5EFE6}
.lb.open{display:grid;grid-template-rows:auto 1fr auto}
.lb-top{display:flex;justify-content:space-between;align-items:center;padding:18px var(--pad)}
.lb-top .tbtn{border-color:rgba(245,239,230,.25);color:#F5EFE6}
.lb-n{font-family:var(--fl);font-weight:800;font-size:1.2rem;direction:ltr}
.lb-stage{position:relative;display:grid;place-items:center;overflow:hidden;min-height:0;padding-inline:var(--pad)}
.lb-img{max-width:min(1100px,100%);max-height:100%;width:auto;height:100%;object-fit:contain;border-radius:20px;user-select:none;-webkit-user-drag:none}
.lb-nav{position:absolute;top:50%;translate:0 -50%;width:60px;height:60px;border-radius:50%;background:rgba(245,239,230,.12);display:grid;place-items:center;color:#F5EFE6;transition:background .3s;z-index:2}
.lb-nav:hover{background:var(--ember)}
.lb-prev{inset-inline-start:var(--pad)}
.lb-next{inset-inline-end:var(--pad)}
:root[dir="rtl"] .lb-nav svg{transform:scaleX(-1)}
.lb-bot{display:flex;justify-content:space-between;align-items:center;gap:20px;padding:18px var(--pad) 26px;flex-wrap:wrap}
.lb-bot h3{font-family:var(--fd);font-size:clamp(28px,3.4vw,48px);line-height:1}
:root[lang="en"] .lb-bot h3{text-transform:uppercase}
.lb-bot .price small{color:rgba(245,239,230,.6)}
.lb-acts{display:flex;gap:10px}
.lb-acts .btn-line{color:#F5EFE6;border-color:rgba(245,239,230,.3)}
@media (max-width:700px){.lb-nav{width:46px;height:46px;top:auto;bottom:10px;translate:none}.lb-img{height:auto;max-height:100%}}
.follow{display:grid;grid-template-columns:1.2fr 1fr;gap:30px;align-items:center;border-radius:36px;background:var(--ember);color:#fff;padding:clamp(30px,5vw,70px);overflow:hidden;position:relative}
.follow h2{font-size:clamp(44px,6vw,96px)}
.follow p{opacity:.9;margin-top:10px;max-width:40ch}
.follow .socials .soc{color:#fff;border-color:rgba(255,255,255,.4)}
.follow .socials .soc:hover{background:#fff;color:var(--ember);border-color:#fff}
.follow .socials .soc small{color:rgba(255,255,255,.8)}
.follow .socials .soc:hover small{color:var(--ember)}
.phone{width:min(260px,70vw);aspect-ratio:9/18;border-radius:36px;border:8px solid #1A1411;background:#1A1411;margin-inline:auto;overflow:hidden;position:relative;rotate:-6deg;box-shadow:0 40px 80px rgba(0,0,0,.35)}
.phone img.ph{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.phone .play{position:absolute;inset:0;display:grid;place-items:center;z-index:2}
.phone .play i{width:70px;height:70px;border-radius:50%;background:rgba(255,255,255,.9);display:grid;place-items:center;color:var(--ember);animation:pulse2 2s infinite}
.phone .play svg{width:28px;height:28px;fill:currentColor;stroke:none;margin-inline-start:4px}
@keyframes pulse2{0%{box-shadow:0 0 0 0 rgba(255,255,255,.6)}70%{box-shadow:0 0 0 22px rgba(255,255,255,0)}100%{box-shadow:0 0 0 0 rgba(255,255,255,0)}}
@media (max-width:800px){.follow{grid-template-columns:1fr}}
</style>
<!--BODY-->
<main id="main">
 <section class="phero ghero" style="padding-bottom:20px">
  <div class="glow"></div>
  <div class="wrap">
   <nav class="crumbs" data-intro aria-label="Breadcrumb"><a href="index.html" data-i18n="home_crumb">الرئيسية</a><svg class="ico flip"><use href="#i-right"/></svg><span data-i18n="nav_gallery">الصور</span></nav>
   <h1 class="display"><span data-split="intro" data-i18n="h1">الصور</span><sup id="gCount"></sup></h1>
   <p class="phero-sub" data-intro data-i18n="sub" style="margin-top:20px"></p>
  </div>
 </section>
 <div class="gfil"><div class="wrap"><div class="pills" id="gFil" role="group"></div></div></div>
 <div class="wrap"><div class="ggrid" id="gGrid"></div></div>
 <section class="sec" style="padding-top:0">
  <div class="wrap"><div class="follow" data-reveal>
    <div><h2 class="display" data-split data-i18n="fo_t">الفيديوهات على تيك توك</h2><p data-i18n="fo_p"></p>
      <div class="socials" style="margin-top:26px"><a class="soc" href="https://www.tiktok.com/@chiknoegypt" target="_blank" rel="noopener">TikTok <small>@chiknoegypt</small></a><a class="soc" href="https://www.instagram.com/chiknoegypt/" target="_blank" rel="noopener">Instagram <small>15K</small></a><a class="soc" href="https://www.facebook.com/ChiknoEgypt/" target="_blank" rel="noopener">Facebook <small>501K</small></a></div></div>
    <a class="phone" href="https://www.tiktok.com/@chiknoegypt" target="_blank" rel="noopener" data-img="6416559" aria-label="TikTok" data-cursor><span class="play"><i><svg><use href="#i-play"/></svg></i></span></a>
  </div></div>
 </section>
 <div class="lb" id="lb" role="dialog" aria-modal="true" aria-label="Photo">
   <div class="lb-top"><span class="lb-n" id="lbN"></span><button class="tbtn" id="lbX" data-i18n-aria="close" aria-label="Close"><svg class="ico"><use href="#i-x"/></svg></button></div>
   <div class="lb-stage" id="lbStage"><button class="lb-nav lb-prev" id="lbPrev" data-i18n-aria="prev" aria-label="Previous"><svg class="ico"><use href="#i-left"/></svg></button><img class="lb-img" id="lbImg" alt=""><button class="lb-nav lb-next" id="lbNext" data-i18n-aria="next" aria-label="Next"><svg class="ico"><use href="#i-right"/></svg></button></div>
   <div class="lb-bot" data-flyroot><div><h3 id="lbName"></h3><span id="lbPrice"></span></div><div class="lb-acts"><button class="btn btn-line" id="lbDish" data-i18n="details">التفاصيل</button><button class="btn btn-fire" id="lbAdd"><svg class="ico"><use href="#i-cart"/></svg><span data-i18n="add">أضف للطلب</span></button></div><span data-fly style="display:none"></span></div>
 </div>
</main>
<!--SCRIPT-->
<script>
(function(){
const C=Chikno,$=C.$,$$=C.$$;
const GROUPS={all:null,chicken:['broasted','grilled','charcoal','strips'],shawarma:['shawarma','fatteh','pies'],grills:['grills'],boxes:['boxes'],sandwiches:['sandwiches','meals'],pizza:['pizza'],more:['sides','kids','sweets']};
let g='all',list=[],cur=0;
const pics=()=>{const seen=new Set();return C.items.filter(i=>{if(!i.img||(GROUPS[g]&&!GROUPS[g].includes(i.cat))||seen.has(i.img))return false;seen.add(i.img);return true;});};
function tile(it,i){const cls=i%11===0?' big':(i%7===3?' tall':'');return `<button class="gi${cls}" data-i="${i}" data-cursor aria-label="${C.esc(C.nm(it))}"><img src="${C.ph(it.img,cls===' big'?900:520)}" alt="${C.esc(C.nm(it))}" loading="lazy" decoding="async" onerror="this.closest('.gi').remove()"><span class="cap"><span>${C.esc(C.nm(it))}</span>${C.money(it.price)}</span></button>`;}
function renderGrid(anim){list=pics();const grid=$('#gGrid');const build=()=>{grid.innerHTML=list.map(tile).join('');$('#gCount').textContent=list.length;
  if(anim&&C.A)gsap.fromTo('#gGrid .gi',{opacity:0,scale:.85,y:40},{opacity:1,scale:1,y:0,stagger:{each:.025,from:'start'},duration:.8,ease:'expo.out'});C.refresh();};
  if(anim&&C.A&&grid.children.length)gsap.to('#gGrid .gi',{opacity:0,scale:.9,duration:.3,stagger:.005,onComplete:build});else build();}
function renderFil(){$('#gFil').innerHTML=Object.keys(GROUPS).map(k=>`<button class="pill" data-g="${k}" aria-pressed="${k===g}">${C.t('g_'+k)}</button>`).join('');}
$('#gFil').addEventListener('click',e=>{const b=e.target.closest('[data-g]');if(!b||b.dataset.g===g)return;g=b.dataset.g;$$('#gFil .pill').forEach(x=>x.setAttribute('aria-pressed',x===b));renderGrid(true);C.scrollTo($('#gGrid'),-170);});
/* lightbox */
const lb=$('#lb');
function show(i,dir){cur=(i+list.length)%list.length;const it=list[cur];const img=$('#lbImg');
  const set=()=>{img.src=C.ph(it.img,1400);img.alt=C.nm(it);$('#lbName').textContent=C.nm(it);$('#lbPrice').innerHTML=C.money(it.price);$('#lbN').textContent=`${cur+1} / ${list.length}`;$('#lbAdd').dataset.id=it.id;};
  if(dir&&C.A){gsap.to(img,{x:-dir*80,opacity:0,duration:.25,ease:'power2.in',onComplete:()=>{set();gsap.fromTo(img,{x:dir*80,opacity:0},{x:0,opacity:1,duration:.5,ease:'expo.out'});}});gsap.fromTo('#lbName',{y:20,opacity:0},{y:0,opacity:1,duration:.5,delay:.2});}else set();}
function open(i,tileEl){show(i);lb.classList.add('open');document.body.style.overflow='hidden';C.lenis&&C.lenis.stop();
  if(C.A&&tileEl){const r=tileEl.getBoundingClientRect();gsap.fromTo(lb,{clipPath:`inset(${r.top}px ${innerWidth-r.right}px ${innerHeight-r.bottom}px ${r.left}px round 22px)`},{clipPath:'inset(0px 0px 0px 0px round 0px)',duration:.8,ease:'expo.inOut'});gsap.from('.lb-top,.lb-bot',{opacity:0,y:20,delay:.5,duration:.5});}
  $('#lbX').focus({preventScroll:true});}
function close(){const t=$(`#gGrid .gi[data-i="${cur}"]`);const done=()=>{lb.classList.remove('open');lb.style.clipPath='';document.body.style.overflow='';C.lenis&&C.lenis.start();};
  if(C.A&&t){const r=t.getBoundingClientRect();gsap.to(lb,{clipPath:`inset(${r.top}px ${innerWidth-r.right}px ${innerHeight-r.bottom}px ${r.left}px round 22px)`,duration:.7,ease:'expo.inOut',onComplete:done});}else done();}
$('#gGrid').addEventListener('click',e=>{const t=e.target.closest('.gi');if(t)open(+t.dataset.i,t);});
$('#lbX').addEventListener('click',close);
const rtlDir=d=>C.rtl()?-d:d;
$('#lbPrev').addEventListener('click',()=>show(cur-1,rtlDir(-1)));$('#lbNext').addEventListener('click',()=>show(cur+1,rtlDir(1)));
$('#lbDish').addEventListener('click',()=>{const id=list[cur].id;close();setTimeout(()=>C.openDish(id),C.A?750:0);});
$('#lbAdd').addEventListener('click',()=>{const id=list[cur].id;C.cart.add(id,1);C.toast('✓ '+C.t('added'),true);if(C.A)gsap.fromTo('#lbAdd',{scale:.9},{scale:1,duration:.6,ease:'elastic.out(1,.4)'});});
addEventListener('keydown',e=>{if(!lb.classList.contains('open'))return;if(e.key==='Escape'){e.stopPropagation();close();}
  const fwd=C.rtl()?'ArrowLeft':'ArrowRight',back=C.rtl()?'ArrowRight':'ArrowLeft';if(e.key===fwd)show(cur+1,rtlDir(1));if(e.key===back)show(cur-1,rtlDir(-1));},true);
let sx=null;$('#lbStage').addEventListener('touchstart',e=>{sx=e.touches[0].clientX;},{passive:true});
$('#lbStage').addEventListener('touchend',e=>{if(sx===null)return;const dx=e.changedTouches[0].clientX-sx;sx=null;if(Math.abs(dx)<50)return;const next=C.rtl()?dx>0:dx<0;show(cur+(next?1:-1),rtlDir(next?1:-1));},{passive:true});
C.init({
 dict:{
  ar:{title:'الصور',h1:'الصور',sub:'صور من الأكل اللي بنعمله – فراخ، شاورما، مشويات وأكتر. دوس على أي صورة تكبرها وتطلب منها. (الصور توضيحية)',g_all:'الكل',g_chicken:'فراخ',g_shawarma:'شاورما',g_grills:'مشويات',g_boxes:'بوكسات',g_sandwiches:'ساندوتشات ووجبات',g_pizza:'بيتزا',g_more:'مقبلات وأكتر',
   fo_t:'الفيديوهات على تيك توك',fo_p:'تشيكنو بينزل فيديوهات من المطبخ والعروض الجديدة على تيك توك وإنستجرام.',details:'التفاصيل',prev:'السابقة',next:'التالية'},
  en:{title:'Gallery',h1:'Gallery',sub:'A taste of what we cook – chicken, shawarma, grills and more. Tap a photo to enlarge it and order. (Photos are illustrative.)',g_all:'All',g_chicken:'Chicken',g_shawarma:'Shawarma',g_grills:'Grills',g_boxes:'Boxes',g_sandwiches:'Sandwiches & meals',g_pizza:'Pizza',g_more:'Sides & more',
   fo_t:'Videos on TikTok',fo_p:'Chikno posts kitchen videos and new offers on TikTok and Instagram.',details:'Details',prev:'Previous',next:'Next'}
 },
 render(){renderFil();renderGrid(false);if(lb.classList.contains('open'))show(cur);},
 scroll(){gsap.from('#gGrid .gi',{y:60,opacity:0,stagger:.03,duration:.9,ease:'expo.out',scrollTrigger:{trigger:'#gGrid',start:'top 90%'}});
  gsap.fromTo('.phone',{rotate:-14,y:60},{rotate:4,y:-40,ease:'none',scrollTrigger:{trigger:'.follow',start:'top bottom',end:'bottom top',scrub:true}});},
 intro(tl){tl.from('#gCount',{scale:0,rotate:-90,duration:.9,ease:'back.out(2)'},'-=.8').from('#gFil .pill',{y:20,opacity:0,stagger:.04,duration:.6,ease:'expo.out'},'-=.6');}
});
})();
</script>
